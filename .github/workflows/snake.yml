name: generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout (for the terrain script)
        uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jiacheng-fu
          outputs: |
            dist/github-snake.svg?color_snake=%23c4472d&color_dots=%23eef0ea,%23cddcb8,%2398b97e,%235e8c4a,%2333582a
            dist/github-snake-dark.svg?color_snake=%23f0784f&color_dots=%23161b16,%23253823,%233b6033,%236b9a52,%23a8cf8a

      # snk has no shape option. This redraws the day cells as contour-line
      # terrain built from the contribution levels (busy weeks become hills).
      # It exits non-zero if snk's markup ever changes, so the last good snake stays.
      - name: redraw cells as terrain
        run: |
          node .github/snake-shape.js dist/github-snake.svg dist/github-snake.svg terrain '#dcc6a6' '#b08d62'
          node .github/snake-shape.js dist/github-snake-dark.svg dist/github-snake-dark.svg terrain '#463e32' '#7d6c52'

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
